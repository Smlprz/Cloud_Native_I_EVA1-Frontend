server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compresion de texto
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }

  # Archivos con hash en el nombre: cache largo
  location /static/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

  # Las rutas de React (/productos, /carrito...) deben devolver index.html al recargar
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
